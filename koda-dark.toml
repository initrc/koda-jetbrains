# Koda.nvim-inspired Alacritty theme
# Based on Koda dark palette, with:
# - background changed to #181818
# - all #ffffff changed to #cccccc
# - bright ANSI colors identical to normal ANSI colors

[colors.primary]
background = "#181818"
foreground = "#b0b0b0"

[colors.cursor]
text = "#181818"
cursor = "#cccccc"

[colors.selection]
text = "#474747"
background = "#d9ba73"

[colors.normal]
black   = "#474747"
red     = "#ff7676"
green   = "#86cd82"
yellow  = "#d9ba73"
blue    = "#8ebeec"
magenta = "#f2a4db"
cyan    = "#5abfb5"
white   = "#cccccc"

[colors.bright]
black   = "#474747"
red     = "#ff7676"
green   = "#86cd82"
yellow  = "#d9ba73"
blue    = "#8ebeec"
magenta = "#f2a4db"
cyan    = "#5abfb5"
white   = "#cccccc"
